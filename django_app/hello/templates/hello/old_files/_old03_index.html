{% load static %}
<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>{{title}}</title>
    <!-- CSS only -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap/dist/css/bootstrap.css" 
        rel="stylesheet" crossorigin="anonymous">
</head>
<body class="container">
    <h1 class="display-1 text-success">{{title}}</h1>
    <p class="lead text-secondary">{{lead|safe}}</p>
    <img src="{% static 'hello/images/Django-e1646279596675.png' %}" width=25% alt="django-logo">
    <p>{{message|safe}}</p>
    <!-- <p class="h6 mt-4">{{data}}</p> -->
    <table class="table">
        <tr>
            <th>id</th>
            <th>name</th>
            <th>age</th>
            <th>mail</th>
            <th>birthday</th>
        </tr>
    {% for item in data %}
        <tr>
            <td>{{item.id}}</td>
            <td>{{item.name}}</td>
            <td>{{item.age}}</td>
            <td>{{item.mail}}</td>
            <td>{{item.birthday}}</td>
        </tr>
    {% endfor %}
    </table>
</body>
</html>
