{% load static %}
<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>{% block title %}{% endblock %}</title>
    <!-- Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap/dist/css/bootstrap.css" 
        rel="stylesheet" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar fixed-top navbar-expand navbar-light bg-light">
        <ul style="width:100%" class="navbar-nav mr-auto">
            <li class="nav-time">
                <a class="nav-link" href="{% url 'index' %}">top</a>
            </li>
            <li class="nav-time">
                <a class="nav-link" href="{% url 'post' %}">post</a>
            </li>
            <li class="nav-time">
                <a class="nav-link" href="{% url 'good' %}">good</a>
            </li>
            <li class="nav-item nav-link fw-bold text-primary">
                logined: "{{login_user}}"</li>
        </ul>
    </nav>
    <div class="container">
        <div>
            {% block header %}
            {% endblock %}
        </div>
        <div class="content">
            {% block content %}
            {% endblock %}
        </div>
        <div class="my-3 text-center">
            <span class="font-wight-bold">
                <a href="/admin/logout?next=/sns/">[logout]</a>
            </span>
            <span class="float-right">
                copyright 2023 SYODA-Tuyano.
            </span>
        </div>
    </div>
</body>
</html>
